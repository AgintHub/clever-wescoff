dag_type: plain_text
description: A step-by-step guide for designing and building the interior of a house
  in San Diego
name: build_interior_for_san_diego_house
nodes:
  define_finishing_touches:
    agent: false
    description: Define finishing touches for interior spaces
    name: define_finishing_touches
    nodes_depended_on:
    - select_interior_electrical_fixtures
    nodes_dependent_on: []
    prompt: Add finishing touches to interior spaces including artwork, rugs, decorative
      items, etc.
  define_flooring_and_cabinet_materials:
    agent: false
    description: Determine flooring and cabinet materials
    name: define_flooring_and_cabinet_materials
    nodes_depended_on:
    - select_lighting_and_plumbing_fixtures
    nodes_dependent_on:
    - define_window_and_door_treatment
    prompt: Choose flooring and cabinet materials such as hardwood, tile, laminate,
      granite, etc.
  define_interior_finishes:
    agent: false
    description: Select finishes for walls, ceilings, and floors
    name: define_interior_finishes
    nodes_depended_on:
    - define_layout_dimensions
    nodes_dependent_on:
    - select_lighting_and_plumbing_fixtures
    prompt: Choose finishes for walls, ceilings and floors such as paint, carpet,
      hardwood, tile, etc.
  define_interior_spaces:
    agent: false
    description: Identify and list all interior spaces for the house
    name: define_interior_spaces
    nodes_depended_on: []
    nodes_dependent_on:
    - select_room_layouts
    prompt: List and briefly describe all interior spaces in the house including living
      room, kitchen, bedrooms, bathrooms, etc.
  define_layout_dimensions:
    agent: false
    description: Determine the dimensions of each interior space
    name: define_layout_dimensions
    nodes_depended_on:
    - select_room_layouts
    nodes_dependent_on:
    - define_interior_finishes
    prompt: Measure and record the dimensions of each interior space, including door
      and window openings.
  define_trim_and_molding:
    agent: false
    description: Select trim and molding for interior spaces
    name: define_trim_and_molding
    nodes_depended_on:
    - define_window_and_door_treatment
    nodes_dependent_on:
    - select_lighting_control
    prompt: Choose trim and molding for interior spaces including baseboards, door
      frames, ceiling molding, etc.
  define_window_and_door_treatment:
    agent: false
    description: Select window and door treatments
    name: define_window_and_door_treatment
    nodes_depended_on:
    - define_flooring_and_cabinet_materials
    nodes_dependent_on:
    - define_trim_and_molding
    prompt: Choose window and door treatments such as blinds, curtains, window films,
      etc.
  select_heating_and_air_conditioning:
    agent: false
    description: Choose heating and air conditioning systems
    name: select_heating_and_air_conditioning
    nodes_depended_on:
    - select_lighting_control
    nodes_dependent_on:
    - select_interior_splumbing_fixtures
    prompt: Choose heating and air conditioning systems including HVAC units, radiators,
      heat pumps, etc.
  select_interior_electrical_fixtures:
    agent: false
    description: Choose interior electrical fixtures
    name: select_interior_electrical_fixtures
    nodes_depended_on:
    - select_interior_splumbing_fixtures
    nodes_dependent_on:
    - define_finishing_touches
    prompt: Choose interior electrical fixtures such as switches, outlets, ceiling
      fans, lighting, etc.
  select_interior_splumbing_fixtures:
    agent: false
    description: Choose interior plumbing fixtures
    name: select_interior_splumbing_fixtures
    nodes_depended_on:
    - select_heating_and_air_conditioning
    nodes_dependent_on:
    - select_interior_electrical_fixtures
    prompt: Choose interior plumbing fixtures such as sinks, toilets, shower stalls,
      faucets, etc.
  select_lighting_and_plumbing_fixtures:
    agent: false
    description: Choose lighting and plumbing fixtures
    name: select_lighting_and_plumbing_fixtures
    nodes_depended_on:
    - define_interior_finishes
    nodes_dependent_on:
    - define_flooring_and_cabinet_materials
    prompt: Select lighting and plumbing fixtures including lighting types, faucets,
      toilet models, etc.
  select_lighting_control:
    agent: false
    description: Choose lighting control options
    name: select_lighting_control
    nodes_depended_on:
    - define_trim_and_molding
    nodes_dependent_on:
    - select_heating_and_air_conditioning
    prompt: Choose lighting control options such as dimmers, switches, timers, occupancy
      sensors, etc.
  select_room_layouts:
    agent: false
    description: Choose layouts for each interior space
    name: select_room_layouts
    nodes_depended_on:
    - define_interior_spaces
    nodes_dependent_on:
    - define_layout_dimensions
    prompt: Select layouts for each interior space considering factors such as natural
      light, circulation, storage and workflow.
